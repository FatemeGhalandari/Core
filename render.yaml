databases:
  - name: core-postgres
    databaseName: core
    user: core

services:
  - type: web
    name: core-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:generate -w apps/api && npm run build:api
    preDeployCommand: npm run db:deploy
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: core-postgres
          property: connectionString
      - key: CLIENT_URLS
        sync: false
